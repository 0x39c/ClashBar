c1: &enableCheck
  type: http
  interval: 21600
  header:
    User-Agent:
      - clash-verge/v2.4.7
  health-check:
    enable: true
    url: https://dns.google/generate_204
    expected-status: 204
    interval: 120
    timeout: 6000
    max-failed-times: 2
    lazy: false
  override:
    ip-version: dual

c2: &disableCheck
  << : *enableCheck
  health-check:
    enable: false

proxy-providers:
  test:
    <<: *enableCheck
    url: https://dns.google/generate_204

usedProviders: &usedProviders
  - "test"

rules:
  - GEOIP,PRIVATE,DIRECT,no-resolve
  - RULE-SET,reject,REJECT
  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT,no-resolve

  - MATCH,正在使用

mixed-port: 7890

allow-lan: false
bind-address: '*'
mode: rule
log-level: info
ipv6: false
find-process-mode: always

tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
    - tcp://any:53
  strict-route: true
  mtu: 1500

dns:
  enable: true
  cache-algorithm: arc
  ipv6: false
  prefer-h3: true
  use-hosts: true
  use-system-hosts: false
  respect-rules: true
  listen: 0.0.0.0:53
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/16
  fake-ip-filter-mode: blacklist

  direct-nameserver-follow-policy: true 
  direct-nameserver:
    - https://223.5.5.5/dns-query

  proxy-server-nameserver:
    - https://77.88.8.8/dns-query


profile:
  store-selected: true
  store-fake-ip: true

proxy-groups:

  - name: 环大陆
    type: url-test
    use: *usedProviders
    filter: "台湾|香港|澳门|俄罗斯|TW|HK"
    exclude-type: "dns|direct"
    empty-fallback: REJECT
    url: https://dns.google/generate_204
    tolerance: 200

  - name: 就这样
    type: url-test
    use: *usedProviders
    exclude-filter: "台湾|香港|澳门|俄罗斯|TW|HK"
    exclude-type: "dns|direct"
    empty-fallback: REJECT
    url: https://dns.google/generate_204
    tolerance: 200

  - name: 正在使用
    type: select
    proxies:
      - 环大陆
      - 就这样
      
  - name: GLOBAL
    type: select
    hidden: true
    proxies:
      - 正在使用

rule-providers:
  reject: 
    type: http
    interval: 86400
    behavior: domain
    url: https://fastly.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt

geodata-mode: true
geox-url:
  geoip: 'https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat'
  geosite: 'https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat'
